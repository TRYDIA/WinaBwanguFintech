<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Wina Bwangu FinTech</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <main class="container login-container">
    <section class="login-card">
      <div class="login-intro">
        <span class="eyebrow">Secure Access</span>
        <h1>Log in to Wina Bwangu</h1>
        <p>Access transaction tools and booth performance dashboards from one responsive workspace.</p>
      </div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email or username</label>
          <div class="input-with-icon">
            <i class="fas fa-user" aria-hidden="true"></i>
            <input type="text" id="loginEmail" placeholder="Email or username"  required>
          </div>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-with-icon">
            <i class="fas fa-lock" aria-hidden="true"></i>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>
          </div>
        </div>
        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox">
            <span>Remember me</span>
          </label>
        </div>
        <button type="submit" class="btn-primary btn-with-icon">
          <i class="fas fa-right-to-bracket" aria-hidden="true"></i>
          <span>Login</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = "index.html";
        } else {
          alert(data.error || "Login failed");
        }
      } catch (err) {
        alert("Cannot reach the server");
      }
    });
  </script>
</body>
</html>
